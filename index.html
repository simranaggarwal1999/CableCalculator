<!DOCTYPE html>
<html>
<head>
<title>Full Cable Calculator</title>
<style>
body { font-family: Arial; margin: 20px; background:#f4f6f9; }
table { border-collapse: collapse; margin-bottom:20px; background:white;}
th, td { padding:8px; border:1px solid #ccc; text-align:center; }
input { width:80px; }
button { padding:10px 20px; background:#0078d4; color:white; border:none; }
h2 { color:#2c3e50; }
</style>
</head>
<body>

<h2>Sheet2 Cable Calculator</h2>

<!-- ✅ INPUT TABLE -->
<table id="wireTable">
<tr>
<th>Type</th>
<th>Dia (mm)</th>
<th>No</th>
<th>Rate</th>
</tr>
<tr><td>Aluminium</td><td><input value="3.15"></td><td><input value="19"></td><td><input value="390"></td></tr>
<tr><td>Steel</td><td><input value="1.7"></td><td><input value="19"></td><td><input value="70"></td></tr>
<tr><td>Alloy</td><td><input value="1.7"></td><td><input value="19"></td><td><input value="500"></td></tr>
</table>

<h3>Core Inputs</h3>
Core Size: <input id="coreSize" value="3.5">
Angle: <input id="angle" value="120">
Insulation Thickness: <input id="coreThk" value="1.5">

<h3>Sheath Inputs</h3>
Inner Sheath Thickness: <input id="innerThk" value="1.5"><br><br>
Outer Sheath Thickness: <input id="outerThk" value="2.5"><br><br>

<h3>Armour</h3>
Strip Width: <input id="stripW" value="4.0">
Strip Thickness: <input id="stripT" value="0.8">
No of Strips: <input id="stripNo" value="14">

<br><br>
<button onclick="calculate()">Calculate</button>

<!-- ✅ OUTPUT -->
<h3>Wire Output</h3>
<table>
<tr><th>Type</th><th>Weight</th><th>Price</th></tr>
<tbody id="wireOutput"></tbody>
</table>

<h3>Layer Output</h3>
<div id="layers"></div>

<h3 id="final"></h3>

<script>
function calculate(){

const density = {
    Aluminium:2700,
    Steel:7850,
    Alloy:2700,
    PVC:1400,
    XLPE:940
};

let rows = document.getElementById("wireTable").rows;
let wireHTML = "";

let totalWeight = 0;
let totalPrice = 0;

// ✅ 1. Wire calculation
for(let i=1;i<rows.length;i++){
    let type = rows[i].cells[0].innerText;
    let d = parseFloat(rows[i].cells[1].children[0].value)/1000;
    let no = parseFloat(rows[i].cells[2].children[0].value);
    let rate = parseFloat(rows[i].cells[3].children[0].value);

    let weight = (Math.PI/4)*d*d*no*density[type]*1000;
    let price = weight * rate;

    totalWeight += weight;
    totalPrice += price;

    wireHTML += `<tr>
        <td>${type}</td>
        <td>${weight.toFixed(2)}</td>
        <td>${price.toFixed(2)}</td>
    </tr>`;
}

document.getElementById("wireOutput").innerHTML = wireHTML;

// ✅ 2. Core insulation
let core = parseFloat(document.getElementById("coreSize").value)/1000;
let thk = parseFloat(document.getElementById("coreThk").value)/1000;

let coreOD = core + 2*thk;

let coreWeight = (Math.PI/4)*(coreOD*coreOD - core*core)*density.PVC*1000;
let corePrice = coreWeight * 100;

// ✅ 3. Inner sheath
let innerThk = parseFloat(document.getElementById("innerThk").value)/1000;
let innerOD = coreOD + 2*innerThk;

let innerWeight = (Math.PI/4)*(innerOD*innerOD - coreOD*coreOD)*density.PVC*1000;
let innerPrice = innerWeight * 100;

// ✅ 4. Armour
let stripW = parseFloat(document.getElementById("stripW").value)/1000;
let stripT = parseFloat(document.getElementById("stripT").value)/1000;
let stripNo = parseFloat(document.getElementById("stripNo").value);

let armourWeight = stripW * stripT * stripNo * density.Steel * 1000;
let armourPrice = armourWeight * 80;

// ✅ 5. Outer sheath
let outerThk = parseFloat(document.getElementById("outerThk").value)/1000;
let outerOD = innerOD + 2*outerThk;

let outerWeight = (Math.PI/4)*(outerOD*outerOD - innerOD*innerOD)*density.PVC*1000;
let outerPrice = outerWeight * 100;

// ✅ Add totals
totalWeight += coreWeight + innerWeight + armourWeight + outerWeight;
totalPrice += corePrice + innerPrice + armourPrice + outerPrice;

// ✅ render layer output
document.getElementById("layers").innerHTML = `
Core Insulation Weight: ${coreWeight.toFixed(2)} | Price: ${corePrice.toFixed(2)} <br>
Inner Sheath Weight: ${innerWeight.toFixed(2)} | Price: ${innerPrice.toFixed(2)} <br>
Armour Weight: ${armourWeight.toFixed(2)} | Price: ${armourPrice.toFixed(2)} <br>
Outer Sheath Weight: ${outerWeight.toFixed(2)} | Price: ${outerPrice.toFixed(2)}
`;

document.getElementById("final").innerText =
"TOTAL WEIGHT = " + totalWeight.toFixed(2) +
" | TOTAL PRICE = " + totalPrice.toFixed(2);
}
</script>

</body>
</html>
