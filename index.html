<!DOCTYPE html>
<html>
<head>
<title>Cable Calculator (Config Driven)</title>

<style>
body { font-family: Arial; margin:20px; background:#f4f6f9;}
.container { display:flex; gap:40px; }
table { border-collapse: collapse; background:white; }
td, th { border:1px solid #999; padding:6px; text-align:center;}
input { width:80px; text-align:center;}
.section { background:#ddd; font-weight:bold;}
.result td, .result th { background:#eef6ff; }
.total { background:#c6efce !important; font-weight:bold;}
</style>

</head>

<body>

<h2>Config Driven Cable Calculator</h2>

<button onclick="calculate()">Calculate</button><br><br>

<div class="container">

<!-- ✅ INPUT TABLE -->
<table id="inputTable"></table>

<!-- ✅ OUTPUT TABLE -->
<table class="result">
<tr class="section">
<td>Particular</td>
<td>Single Weight</td>
<td>Single Price</td>
<td>Multi Weight</td>
<td>Multi Price</td>
</tr>

<tr><td>Wire</td><td id="sw"></td><td id="sp"></td><td id="mw"></td><td id="mp"></td></tr>
<tr><td>Core</td><td id="scw"></td><td id="scp"></td><td id="mcw"></td><td id="mcp"></td></tr>
<tr><td>Inner</td><td id="siw"></td><td id="sip"></td><td id="miw"></td><td id="mip"></td></tr>
<tr><td>Armour</td><td id="saw"></td><td id="sap"></td><td id="maw"></td><td id="map"></td></tr>
<tr><td>Outer</td><td id="sow"></td><td id="sop"></td><td id="mow"></td><td id="mop"></td></tr>

<tr class="total">
<td>Total</td>
<td id="stw"></td><td id="stp"></td>
<td id="mtw"></td><td id="mtp"></td>
</tr>
</table>

</div>

<script>

// ================= CONSTANTS =================
const constants = {
    PI: Math.PI,
    AL: 2700,
    PVC: 1400,
    STEEL: 7850
};

// ================= INPUT CONFIG =================
const inputs = [
    { label: "Wire Dia", id: "d", value: 3.15 },
    { label: "Wire Count", id: "n", value: 19 },
    { label: "Rate", id: "rate", value: 390 },
    { label: "Core Size", id: "core", value: 3.5 },
    { label: "Core Thickness", id: "core_thk", value: 1.5 },
    { label: "Inner Thickness", id: "inner", value: 1.5 },
    { label: "Strip No", id: "strip", value: 14 },
    { label: "Outer Thickness", id: "outer", value: 2.5 }
];

// ================= FORMULAS =================
const formulas = [

    // SINGLE
    { id:"sw", formula:"(PI/4)*(d/1000)**2*n*AL*1000"},
    { id:"sp", formula:"sw*rate"},

    { id:"coreOD", formula:"(core+2*core_thk)/1000"},
    { id:"scw", formula:"(PI/4)*(coreOD**2-(core/1000)**2)*PVC*1000"},
    { id:"scp", formula:"scw*100"},

    { id:"innerOD", formula:"coreOD+2*(inner/1000)"},
    { id:"siw", formula:"(PI/4)*(innerOD**2-coreOD**2)*PVC*1000"},
    { id:"sip", formula:"siw*100"},

    { id:"saw", formula:"(0.8/1000)*(4/1000)*strip*STEEL*1000*0.65"},
    { id:"sap", formula:"saw*80"},

    { id:"outerOD", formula:"innerOD+(0.8/1000)*2+2*(outer/1000)"},
    { id:"sow", formula:"(PI/4)*(outerOD**2-(innerOD+(0.8/1000)*2)**2)*PVC*1000"},
    { id:"sop", formula:"sow*100"},

    { id:"stw", formula:"sw+scw+siw+saw+sow"},
    { id:"stp", formula:"sp+scp+sip+sap+sop"},

    // MULTI
    { id:"cores", formula:"3"},
    { id:"packed", formula:"coreOD*Math.sqrt(cores)"},

    { id:"mw", formula:"sw"},
    { id:"mp", formula:"mw*rate"},

    { id:"mcw", formula:"(PI/4)*(coreOD**2-(core/1000)**2)*PVC*cores*1000"},
    { id:"mcp", formula:"mcw*100"},

    { id:"minnerOD", formula:"packed+2*(inner/1000)"},
    { id:"miw", formula:"(PI/4)*(minnerOD**2-packed**2)*PVC*1000"},
    { id:"mip", formula:"miw*100"},

    { id:"maw", formula:"(0.8/1000)*(4/1000)*(strip*2)*STEEL*1000*0.65"},
    { id:"map", formula:"maw*80"},

    { id:"mouterOD", formula:"minnerOD+(0.8/1000)*2+2*(outer/1000)"},
    { id:"mow", formula:"(PI/4)*(mouterOD**2-(minnerOD+(0.8/1000)*2)**2)*PVC*1000"},
    { id:"mop", formula:"mow*100"},

    { id:"mtw", formula:"mw+mcw+miw+maw+mow"},
    { id:"mtp", formula:"mp+mcp+mip+map+mop"}
];

// ================= RENDER INPUT =================
function renderInput(){
    let html = `<tr class="section"><td colspan="2">INPUT</td></tr>`;
    inputs.forEach(f => {
        html += `
        <tr>
            <td>${f.label}</td>
            <td><input id="${f.id}" value="${f.value}" type="number" step="any"></td>
        </tr>`;
    });
    inputTable.innerHTML = html;
}

// ================= ENGINE =================
function evaluate(){

    let values = {};

    // inputs
    inputs.forEach(i => {
        values[i.id] = parseFloat(document.getElementById(i.id).value) || 0;
    });

    // constants
    Object.assign(values, constants);

    // formulas
    formulas.forEach(f => {
        let expr = f.formula;

        Object.keys(values).forEach(k=>{
            expr = expr.replaceAll(k, values[k]);
        });

        try {
            values[f.id] = eval(expr);
        } catch {
            values[f.id] = 0;
        }
    });

    return values;
}

// ================= CALCULATE =================
function calculate(){

    let v = evaluate();

    Object.keys(v).forEach(id=>{
        if(document.getElementById(id)){
            document.getElementById(id).innerText =
                (typeof v[id]==="number") ? v[id].toFixed(2) : v[id];
        }
    });
}

// auto render
renderInput();

// optional Excel behavior
document.addEventListener("input", calculate);

</script>

</body>
</html>
